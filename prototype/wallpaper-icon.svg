<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130">
  <!-- App icon for Ambient Wallpaper: the lake at golden hour. Rendered to wallpaper-icon.png and wallpaper-largeIcon.png. -->
  <defs>
    <clipPath id="tile"><rect width="130" height="130" rx="30"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2b4d"/><stop offset=".5" stop-color="#9d6a6c"/><stop offset="1" stop-color="#e0a060"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a52"/><stop offset="1" stop-color="#1a1121"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffe7b0" stop-opacity=".75"/><stop offset="1" stop-color="#ffe7b0" stop-opacity="0"/></radialGradient>
  </defs>
  <g clip-path="url(#tile)">
