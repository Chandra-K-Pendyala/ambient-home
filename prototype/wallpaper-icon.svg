    <path d="M52 38l-6 10 4-2 2 3 3-4 3 2zM82 52l-4 6 3-1 2 2 2-3z" fill="#ffe1c4" opacity=".9"/>
    <path d="M0 82c18-6 36-8 58-6s44 2 72-4v10H0z" fill="#302237"/>
    <path d="M24 76l4-10 4 10zM31 77l5-13 5 13zM96 76l4-11 4 11zM103 75l5-14 5 14z" fill="#302237"/>
    <g stroke="#ffd9a0" stroke-linecap="round" opacity=".85"><path d="M60 88h8M57 95h14M55 103h18M58 112h12" stroke-width="1.6"/></g>
  </g>
</svg>
