    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26355f"/><stop offset="1" stop-color="#0a1022"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#dfe6ff" stop-opacity=".45"/><stop offset="1" stop-color="#dfe6ff" stop-opacity="0"/></radialGradient>
  </defs>
